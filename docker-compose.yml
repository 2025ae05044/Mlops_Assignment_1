services:
  heart-disease-api:
    build: .
    image: heart-disease-mlops:latest
    container_name: heart-disease-api-compose
    ports:
      - "8002:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
